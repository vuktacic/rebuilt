[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebuilt"
version = "0.1.0"
description = "Local video-to-LEGO-instructions MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]
mlx = [
  "mlx>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@a5deef1ce4b0b5ef2a01e5a02a36805878a7ee3c ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
